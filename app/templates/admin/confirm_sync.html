{% extends "base.html" %}
{% block title %}{{ title }} — Examinator{% endblock %}
{% block content %}
<div class="container" style="padding:2rem 1.5rem 3rem;max-width:640px;">
  <a href="/admin#microsoft-sync" style="color:var(--muted);font-size:0.9rem;">← Retour à l'administration</a>
  <h1 style="margin:1rem 0 0.5rem;">{{ title }}</h1>
  <p style="color:var(--muted);margin-bottom:1.5rem;">{{ description }}</p>
  <form method="post" action="{{ action }}">
    <button type="submit" class="btn btn-primary">{{ button_label }}</button>
    <a href="/admin#microsoft-sync" class="btn btn-secondary" style="margin-left:0.5rem;">Annuler</a>
  </form>
</div>
{% endblock %}
